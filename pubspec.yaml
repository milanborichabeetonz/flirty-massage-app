name: flirtymessages
description: "Flirty Messages & Pickup Lines app .. demo app"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.8
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  carousel_slider: ^5.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  get: ^4.7.3
  shared_preferences: ^2.5.5
  gal: ^2.3.0
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/dating_tips.json
    - .env

  fonts:

    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf


    - family: BebasNeue
      fonts:
      - asset: assets/fonts/BebasNeue-Regular.ttf


    - family: BlackOpsOne
      fonts:
        - asset: assets/fonts/BlackOpsOne-Regular.ttf


    - family: CinzelDecorative
      fonts:
        - asset: assets/fonts/CinzelDecorative-Regular.ttf


    - family: LobsterTwo
      fonts:
        - asset: assets/fonts/LobsterTwo-Regular.ttf


    - family: MonsieurLaDoulaise
      fonts:
        - asset: assets/fonts/MonsieurLaDoulaise-Regular.ttf


    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VariableFont_wght.ttf


    - family: PlaywriteCUGuides
      fonts:
        - asset: assets/fonts/PlaywriteCUGuides-Regular.ttf


    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VariableFont_wdth,wght.ttf


    - family: SmoochSans
      fonts:
        - asset: assets/fonts/SmoochSans-VariableFont_wght.ttf

